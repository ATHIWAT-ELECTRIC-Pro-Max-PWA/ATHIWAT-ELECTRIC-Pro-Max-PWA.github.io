  <script>
  (()=>{
    const STORE_KEY='athiwat_exam_demo_v1';
    const CLOUD_SESSION_KEY='athiwat_supabase_session_v1';
    const cloudConfig=window.SUPABASE_CONFIG||null;
    const cloudEnabled=Boolean(cloudConfig?.url&&cloudConfig?.publishableKey&&location.protocol.startsWith('http'));
    let cloudSession=null,cloudProfile=null,cloudAnalytics=null,cloudReady=false,deviceBlocked=false,cloudAuthMode='login',cloudAuthMessage='',cloudLeaseToken=null,heartbeatTimer=null;
    try{cloudSession=JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY)||'null')}catch(e){}
    const makeUuid=()=>crypto?.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
    let cloudDeviceId=localStorage.getItem('athiwat_device_id');if(!cloudDeviceId){cloudDeviceId=makeUuid();localStorage.setItem('athiwat_device_id',cloudDeviceId)}
    function saveCloudSession(value){cloudSession=value;if(value)localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(value));else localStorage.removeItem(CLOUD_SESSION_KEY)}
    async function cloudRequest(path,options={}){if(!cloudEnabled)throw new Error('ยังไม่ได้ตั้งค่า Supabase');const headers={apikey:cloudConfig.publishableKey,Accept:'application/json',...(options.headers||{})};if(cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;if(options.body!=null&&!headers['Content-Type'])headers['Content-Type']='application/json';const url=cloudConfig.url.replace(/\/$/,'')+path;let response=await fetch(url,{...options,headers});if(response.status===401&&cloudSession?.refresh_token){await refreshCloudSession();headers.Authorization='Bearer '+cloudSession.access_token;response=await fetch(url,{...options,headers})}const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}if(!response.ok){const message=data?.msg||data?.message||data?.details||data?.hint||data?.error_description||data?.error||raw||('HTTP '+response.status);throw new Error(typeof message==='string'?message:JSON.stringify(message))}return data}

    async function cloudAuthRequest(path,body){const response=await fetch(cloudConfig.url.replace(/\/$/,'')+'/auth/v1/'+path,{method:'POST',headers:{apikey:cloudConfig.publishableKey,'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}if(!response.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||raw||('HTTP '+response.status));return data}
    const cloudRpc=(name,params={})=>cloudRequest('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(params)});
    async function refreshCloudSession(){if(!cloudSession?.refresh_token)throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');const next=await cloudAuthRequest('token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});next.expires_at=Date.now()+Number(next.expires_in||3600)*1000;saveCloudSession(next);return next}

    async function initializeCloud(){if(!cloudEnabled)return;cloudReady=false;deviceBlocked=false;render();try{if(!cloudSession?.access_token){cloudReady=true;render();return}if(!cloudSession.expires_at||cloudSession.expires_at<Date.now()+60000)await refreshCloudSession();const authUser=await cloudRequest('/auth/v1/user');cloudSession.user=authUser;saveCloudSession(cloudSession);let adminClaimed=false;try{adminClaimed=await cloudRpc('claim_initial_content_admin',{})}catch(e){}await loadCloudState();if(adminClaimed){await loadCloudState();cloudAuthMessage='บัญชีแรกได้รับสิทธิ์ผู้ดูแลคลังข้อสอบแล้ว'}const lease=await cloudRpc('claim_device_session',{p_device_id:cloudDeviceId});const item=Array.isArray(lease)?lease[0]:lease;cloudLeaseToken=item?.lease_token||null;if(!item?.accepted){deviceBlocked=true;cloudReady=true;render();return}if(heartbeatTimer)clearInterval(heartbeatTimer);heartbeatTimer=setInterval(async()=>{try{const ok=await cloudRpc('heartbeat_device_session',{p_device_id:cloudDeviceId,p_lease_token:cloudLeaseToken});if(ok!==true){deviceBlocked=true;clearInterval(heartbeatTimer);heartbeatTimer=null;render()}}catch(e){}},30000);render()}catch(error){saveCloudSession(null);cloudProfile=null;cloudReady=true;cloudAuthMessage='เชื่อมต่อไม่สำเร็จ: '+error.message;render()}}
    async function signOutCloud(){try{if(cloudLeaseToken)await cloudRpc('release_device_session',{p_device_id:cloudDeviceId,p_lease_token:cloudLeaseToken});if(cloudSession?.access_token)await cloudRequest('/auth/v1/logout',{method:'POST'})}catch(e){}if(heartbeatTimer)clearInterval(heartbeatTimer);heartbeatTimer=null;cloudLeaseToken=null;saveCloudSession(null);cloudProfile=null;cloudReady=false;deviceBlocked=false;db={user:null,questions:[],answers:[],attempts:[],freeUsage:{date:todayKey(),count:0}};document.querySelector('.modal-backdrop')?.remove();render()}

    let db=loadStore();if(cloudEnabled)db={user:null,questions:[],answers:[],attempts:[],freeUsage:{date:todayKey(),count:0}};else{if(!db.user)db.user={email:'demo@athiwat.local',plan:'free'};if(!db.attempts)db.attempts=[];if(!db.freeUsage)db.freeUsage={date:todayKey(),count:0};if(db.freeUsage.date!==todayKey())db.freeUsage={date:todayKey(),count:0}}
    let page='overview',session=null,sessionResult=null,questionFilter={type:'',part:'',subject:'',topic:''},bankFilter='',timerId=null,loginPlan='free';
    const persist=()=>{if(!cloudEnabled)localStorage.setItem(STORE_KEY,JSON.stringify(db))};persist();
    const isPro=()=>db.user?.plan==='pro';const remaining=()=>Math.max(0,10-(db.freeUsage?.count||0));
    const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const app=document.getElementById('app');
    const pageInfo={overview:['ภาพรวม','เตรียมความพร้อมอย่างเป็นระบบ'],exams:['คลังข้อสอบ','เลือกภาค หมวดวิชา และเรื่องย่อยที่ต้องการฝึก'],analytics:['วิเคราะห์จุดอ่อน','ติดตามความแม่นยำแยกตาม Topic จากข้อที่เคยทำ'],bank:['จัดการคลังข้อสอบ','เพิ่มและจัดหมวดข้อสอบของคุณเองได้ทีละข้อ']};
    const navItems=[['overview','▦','ภาพรวม'],['exams','▤','ทำข้อสอบ'],['analytics','◉','วิเคราะห์ผล'],['bank','▧','คลังข้อสอบ']];
    function shell(){const activeLabel=pageInfo[page]?.[0]||'ภาพรวม';return `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">⚡</div><div><strong>ATHIWAT ELECTRIC</strong><small>Pro Max · คู่มือสอบครูผู้ช่วย</small></div></div><div class="nav-label">เมนูหลัก</div><nav class="nav-list">${navItems.map(([id,ico,label])=>`<button class="nav-btn ${page===id?'active':''}" data-nav="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav><div class="side-spacer"></div><div class="side-note"><strong>เริ่มต้นได้ทันที</strong>เพิ่มข้อสอบพร้อม Topic Tag เพื่อดูจุดแข็งและจุดที่ควรซ่อมให้แม่นยำ</div><div class="side-user"><div class="avatar">${isPro()?'P':'A'}</div><div><strong>${isPro()?'Pro Max':'สมาชิกฟรี'}</strong><small>${esc(db.user.email||'บัญชีตัวอย่าง')}</small></div><button data-action="account" aria-label="บัญชี">⋯</button></div></aside><section class="main-area"><header class="topbar"><div class="mobile-brand"><div class="brand-mark">⚡</div><span>ATHIWAT Pro Max</span></div><div class="muted" style="font-size:11px">${esc(activeLabel)} <span style="margin:0 6px;color:#bdc8d6">/</span> ระบบเตรียมสอบครูผู้ช่วยอาชีวศึกษา</div><div class="topbar-right"><div class="online-pill"><i class="online-dot"></i>พร้อมใช้งาน</div><div class="plan-pill">${isPro()?'✦ PRO MAX':'FREE · '+remaining()+'/10 ข้อวันนี้'}</div><button class="account-button" data-action="account"><div class="avatar">${isPro()?'P':'A'}</div><div><strong>${esc((db.user.email||'บัญชีตัวอย่าง').split('@')[0])}</strong><small>${isPro()?'สมาชิก Pro Max':'สมาชิกฟรี'}</small></div></button></div></header><main class="content" id="content"></main></section></div><nav class="mobile-bottom">${navItems.map(([id,ico,label])=>`<button data-nav="${id}" class="${page===id?'active':''}"><span>${ico}</span>${label}</button>`).join('')}</nav>`}
    function pageHeader(title,sub,action=''){return `<div class="page-heading"><div><div class="eyebrow">ATHIWAT ELECTRIC · PRO MAX</div><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="page-actions">${action}</div>`:''}</div>`}
    function stat(label,value,hint,ico){return `<article class="stat-card"><div class="stat-top">${label}<span class="stat-icon">${ico}</span></div><div class="stat-value">${value}</div><div class="stat-hint">${hint}</div></article>`}
    function currentStats(){const total=cloudEnabled&&cloudAnalytics?cloudAnalytics.reduce((n,a)=>n+a.total,0):db.answers.length,correct=cloudEnabled&&cloudAnalytics?cloudAnalytics.reduce((n,a)=>n+a.correct,0):db.answers.filter(a=>a.correct).length;const acc=total?Math.round(correct*100/total):0;const weak=getTopicStats().filter(t=>t.count&&t.percent<60).length;return {total,correct,acc,weak}}
    function getTopicStats(){if(cloudEnabled&&cloudAnalytics)return cloudAnalytics;const mp=new Map();for(const q of db.questions){if(!isPro()&&q.access==='pro')continue;if(!mp.has(q.topic))mp.set(q.topic,{topic:q.topic,subject:q.subject,part:q.part,type:q.type,total:0,correct:0,count:0,percent:null})}for(const a of db.answers){const q=db.questions.find(x=>x.id===a.questionId);const topic=a.topic||q?.topic;if(!topic)continue;if(!isPro()&&q?.access==='pro')continue;if(!mp.has(topic))mp.set(topic,{topic,subject:a.subject||q?.subject||'',part:a.part||q?.part||'',type:a.type||q?.type||'general',total:0,correct:0,count:0,percent:null});const row=mp.get(topic);row.total++;row.correct+=a.correct?1:0}for(const x of mp.values()){x.count=x.total;x.percent=x.total?Math.round(x.correct*100/x.total):0}return [...mp.values()].sort((a,b)=>{if(a.count&&b.count)return a.percent-b.percent||a.topic.localeCompare(b.topic,'th');if(a.count)return -1;if(b.count)return 1;return a.topic.localeCompare(b.topic,'th')})}
    function radarSvg(items){const rows=items.slice(0,6);if(!rows.length)return '';const cx=180,cy=135,r=88,n=rows.length;const pt=(i,scale)=>{const angle=-Math.PI/2+(Math.PI*2*i/n);return [cx+Math.cos(angle)*r*scale,cy+Math.sin(angle)*r*scale]};const poly=(scale)=>rows.map((_,i)=>pt(i,scale).join(',')).join(' ');const valuePoly=rows.map((x,i)=>pt(i,Math.max(.08,x.count?x.percent/100:.05)).join(',')).join(' ');const axes=rows.map((x,i)=>{const [px,py]=pt(i,1),[lx,ly]=pt(i,1.23);const anchor=lx<cx-10?'end':lx>cx+10?'start':'middle';return `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#e7edf5"/><text x="${lx}" y="${ly}" text-anchor="${anchor}" class="radar-label">${esc(x.topic.length>15?x.topic.slice(0,14)+'…':x.topic)}</text><text x="${px}" y="${py-6}" text-anchor="middle" class="radar-number">${x.count?x.percent+'%':'—'}</text>`}).join('');return `<svg viewBox="0 0 360 270" role="img" aria-label="กราฟเรดาร์ความแม่นยำตามเรื่องย่อย"><polygon points="${poly(1)}" fill="#f8fbfe" stroke="#dce6f1"/>${[.75,.5,.25].map(s=>`<polygon points="${poly(s)}" fill="none" stroke="#e7edf5"/>`).join('')}${axes}<polygon points="${valuePoly}" fill="#27bdd222" stroke="#0878d8" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="3" fill="#0878d8"/></svg>`}
    function topicRows(list,limit=6){return list.filter(x=>x.count).slice(0,limit).map(x=>`<div class="topic-row ${x.percent<60?'weak':''}"><div><div class="topic-title">${esc(x.topic)}</div><div class="topic-sub">${esc(x.subject)} · ${x.count} ข้อ</div></div><div class="topic-percent" style="color:${x.percent<60?'#c65c49':'#1765aa'}">${x.percent}%</div><div class="progress-wrap"><div class="progress-bar" style="width:${x.percent}%"></div></div></div>`).join('')}
    function overview(){const s=currentStats(),topics=getTopicStats(),weak=topics.filter(x=>x.count&&x.percent<60);const history=db.attempts.slice(-4).reverse();return `${pageHeader('เตรียมสอบครูผู้ช่วยอาชีวศึกษา','วางแผนฝึกเป็นภาค ไล่เก็บทีละเรื่อง และเห็นพัฒนาการของคุณ')}<section class="hero"><div class="hero-copy"><div class="hero-kicker">ATHIWAT ELECTRIC PRO MAX ⚡</div><h2>พร้อมหรือยัง? เริ่มฝึกจากเรื่องที่สำคัญ</h2><p>เลือกได้ทั้งรอบทั่วไปและกรณีพิเศษ ครบภาค ก · ภาค ข · ภาค ค พร้อมเฉลยและ Key Point</p><div class="hero-actions"><button class="btn btn-white" data-start="practice">เริ่มฝึกทำข้อสอบ <span>→</span></button><button class="btn" style="background:#ffffff20;color:#fff;border:1px solid #ffffff55" data-nav="analytics">ดูการวิเคราะห์</button></div></div><div class="hero-art" aria-hidden="true">📚</div></section><div class="grid stats-grid">${stat('ทำไปแล้ว',s.total+' ข้อ',cloudEnabled?'ซิงก์จากทุกอุปกรณ์':'จากทุกชุดที่ทำในอุปกรณ์นี้','✎')}${stat('ความแม่นยำ',s.total?s.acc+'%':'—',s.total?'คำนวณจากคำตอบทั้งหมด':'เริ่มทำข้อสอบเพื่อเก็บสถิติ','◉')}${stat('เรื่องที่ควรซ่อม',weak.length+' เรื่อง',weak.length?'ทำได้ต่ำกว่า 60%':'ยังไม่มีจุดอ่อนที่ต้องซ่อม','⌁')}${stat(isPro()?'สิทธิ์ Pro Max':'โควตาฟรีวันนี้',isPro()?'ไม่จำกัด':remaining()+' ข้อ',isPro()?'เข้าถึงคลังข้อสอบทั้งหมด':'เริ่มต้นฟรี สูงสุด 10 ข้อต่อวัน','✦')}</div><div class="section-title">เลือกโหมดการทำข้อสอบ <span>เลือกจำนวนข้อและขอบเขตได้เอง</span></div><div class="grid mode-grid"><article class="mode-card"><div class="mode-icon">✍️</div><h3>ฝึกทำ · Practice</h3><p>ตรวจคำตอบทันที พร้อมเฉลยและ Key Point หลังทำแต่ละข้อ</p><button class="btn btn-primary" data-start="practice">เลือกข้อสอบ →</button></article><article class="mode-card"><div class="mode-icon">⏱️</div><h3>จำลองสนามจริง · Mock</h3><p>จับเวลาจริง สลับตัวเลือก และดูเฉลยหลังส่งข้อสอบ</p><button class="btn btn-ghost" data-start="mock">เริ่มจำลองสอบ →</button></article><article class="mode-card"><div class="mode-icon">🎯</div><h3>ซ่อมจุดอ่อน</h3><p>${weak.length?'สุ่มฝึกเฉพาะ '+weak.length+' เรื่องที่คะแนนต่ำกว่า 60%':'ทำข้อสอบก่อน แล้วระบบจะคัดเรื่องที่ควรกลับไปทบทวน'}</p><button class="btn ${weak.length?'btn-ghost':'btn-outline'}" data-action="repair" ${weak.length?'':'disabled'}>เริ่มซ่อมจุดอ่อน →</button></article></div><div class="grid content-grid"><section class="panel"><div class="panel-title"><div><h3>ความแม่นยำตามเรื่องย่อย</h3><p>${cloudEnabled?'คะแนนจากประวัติการตอบที่ซิงก์ไว้':'คะแนนจากประวัติการตอบในอุปกรณ์นี้'}</p></div><button class="btn btn-small btn-outline" data-nav="analytics">ดูทั้งหมด</button></div>${topics.some(x=>x.count)?`<div class="radar-wrap">${radarSvg(topics)}</div><div class="legend"><span class="tag green">≥ 80% แข็งแรง</span><span class="tag amber">60–79% ทบทวนเพิ่ม</span><span class="tag red">&lt; 60% ควรซ่อม</span></div>`:`<div class="empty-state"><div class="big">◉</div>เมื่อเริ่มทำข้อสอบ กราฟวิเคราะห์ตาม Topic จะปรากฏที่นี่</div>`}</section><section class="panel"><div class="panel-title"><div><h3>ประวัติการฝึกล่าสุด</h3><p>สรุปผลแต่ละชุดที่ทำ</p></div><span class="tag">${history.length} ชุด</span></div>${history.length?history.map(h=>`<div class="history-item"><div><strong>${h.mode==='mock'?'จำลองสนามจริง':'ฝึกทำ'} · ${h.total} ข้อ</strong><small>${new Date(h.at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}</small></div><div class="history-score">${h.score}/${h.total}</div></div>`).join(''):`<div class="empty-state"><div class="big">🗒️</div>ยังไม่มีประวัติ ลองทำข้อสอบชุดแรกได้เลย</div>`}</section></div><div class="notice" style="margin-top:16px">ข้อสอบในระบบนี้เป็นตัวอย่างสำหรับสาธิต สามารถเพิ่มหรือแก้เนื้อหาให้ตรงกับประกาศรับสมัครและเกณฑ์ฉบับล่าสุดได้จากเมนู “คลังข้อสอบ”</div>`}
    function examCatalog(){const all=visibleQuestions();const subjects=[...new Set(all.map(q=>q.subject))];const topics=[...new Set(all.filter(q=>!questionFilter.subject||q.subject===questionFilter.subject).map(q=>q.topic))];let q=all.filter(x=>(!questionFilter.type||x.type===questionFilter.type)&&(!questionFilter.part||x.part===questionFilter.part)&&(!questionFilter.subject||x.subject===questionFilter.subject)&&(!questionFilter.topic||x.topic===questionFilter.topic));return `${pageHeader('คลังข้อสอบ','เลือกขอบเขตตามประเภทการสอบ ภาค หมวดวิชา และเรื่องย่อย')}<section class="filter-panel"><div class="filters"><div class="field"><label>ประเภทการสอบ</label><select data-filter="type"><option value="">ทุกประเภท</option><option value="general" ${questionFilter.type==='general'?'selected':''}>รอบทั่วไป</option><option value="special" ${questionFilter.type==='special'?'selected':''}>รอบกรณีพิเศษ</option></select></div><div class="field"><label>ภาค</label><select data-filter="part"><option value="">ทุกภาค</option>${PARTS.map(x=>`<option ${questionFilter.part===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>หมวดวิชา</label><select data-filter="subject"><option value="">ทุกหมวดวิชา</option>${subjects.map(x=>`<option ${questionFilter.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>เรื่องย่อย · Topic Tag</label><select data-filter="topic"><option value="">ทุกเรื่อง</option>${topics.map(x=>`<option ${questionFilter.topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="open-setup">ตั้งค่าชุดข้อสอบ</button></div></section><div class="section-title">ข้อสอบที่ตรงกับตัวกรอง <span>${q.length} ข้อ · ${isPro()?'คลัง Pro Max':'คลังพื้นฐาน'}</span></div><div class="question-list">${q.length?q.map((x,i)=>`<article class="question-card"><div class="question-card-top"><div><h3>${i+1}. ${esc(x.text)}</h3><p>${esc(x.explanation||'')}</p></div><span class="tag ${x.access==='pro'?'amber':'green'}">${x.access==='pro'?'PRO':'พื้นฐาน'}</span></div><div class="meta"><span class="tag gray">${esc(TYPE_LABEL[x.type]||x.type)}</span><span class="tag gray">${esc(x.part)}</span><span class="tag">${esc(x.subject)}</span><span class="tag">${esc(x.topic)}</span></div></article>`).join(''):`<div class="empty-state"><div class="big">🔎</div>ไม่พบข้อสอบ ลองเปลี่ยนตัวกรองหรือเพิ่มข้อสอบในคลัง</div>`}</div>`}

    function analytics(){const stats=getTopicStats(),weak=stats.filter(x=>x.count&&x.percent<60),recent=db.attempts.slice(-8).reverse();return `${pageHeader('วิเคราะห์จุดแข็งและจุดอ่อน','ดูผลแยกตามเรื่องย่อย แล้วฝึกซ้ำเฉพาะส่วนที่ยังไม่แม่น',weak.length?`<button class="btn btn-primary" data-action="repair">🎯 ซ่อมจุดอ่อน ${weak.length} เรื่อง</button>`:'')}<div class="grid content-grid"><section class="panel"><div class="panel-title"><div><h3>Radar Chart · แยกตาม Topic</h3><p>คะแนนเฉลี่ยจากคำตอบสะสมของคุณ</p></div><span class="tag">${currentStats().total} คำตอบ</span></div>${stats.some(x=>x.count)?`<div class="radar-wrap">${radarSvg(stats)}</div><div class="legend"><span class="tag green">80–100% แข็งแรง</span><span class="tag amber">60–79% ทบทวน</span><span class="tag red">ต่ำกว่า 60% ซ่อมจุดอ่อน</span></div>`:`<div class="empty-state"><div class="big">📊</div>ยังไม่มีข้อมูลวิเคราะห์<br>ทำข้อสอบอย่างน้อยหนึ่งข้อเพื่อเริ่มดูผลตาม Topic</div>`}</section><section class="panel"><div class="panel-title"><div><h3>สรุปผลการทำข้อสอบ</h3><p>เฉพาะข้อที่เคยตอบ</p></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat-card" style="box-shadow:none"><div class="stat-top">ตอบถูก</div><div class="stat-value">${currentStats().correct}</div></div><div class="stat-card" style="box-shadow:none"><div class="stat-top">ความแม่นยำ</div><div class="stat-value">${currentStats().total?currentStats().acc+'%':'—'}</div></div></div><div class="divider"></div><div class="panel-title"><div><h3>เรื่องที่ควรซ่อม</h3><p>คะแนนต่ำกว่า 60%</p></div></div>${weak.length?`<div class="topic-list">${topicRows(weak,8)}</div><button class="btn btn-primary btn-block" style="margin-top:13px" data-action="repair">ฝึกเฉพาะ ${weak.length} เรื่องนี้</button>`:`<div class="empty-state" style="padding:17px">${currentStats().total?'ยังไม่มี Topic ที่ต่ำกว่า 60% ทำได้ดีมาก':'ข้อมูลจะแสดงหลังทำข้อสอบ'}</div>`}</section></div><div class="section-title">ผลคะแนนแยกตามเรื่องย่อย <span>ข้อสอบทุกข้     function bank(){const qs=visibleQuestions().filter(q=>!bankFilter||[q.text,q.subject,q.topic].join(' ').toLowerCase().includes(bankFilter.toLowerCase())),canManage=!cloudEnabled||db.user?.role==='content_admin';const toolbar=cloudEnabled?`<div class="bank-toolbar"><div class="field" style="min-width:min(100%,260px);flex:1"><input type="search" data-bank-filter placeholder="ค้นหาโจทย์ วิชา หรือ Topic…" value="${esc(bankFilter)}"></div><span class="notice">${canManage?'ข้อสอบที่เพิ่มจะซิงก์ให้สมาชิกทุกอุปกรณ์':'คลังออนไลน์ที่ผู้ดูแลจัดเตรียม'}</span></div>`:`<div class="bank-toolbar"><div class="field" style="min-width:min(100%,260px);flex:1"><input type="search" data-bank-filter placeholder="ค้นหาโจทย์ วิชา หรือ Topic…" value="${esc(bankFilter)}"></div><button class="btn btn-outline btn-small" data-action="export">ส่งออก JSON</button><button class="btn btn-outline btn-small" data-action="import">นำเข้า JSON</button></div>`;return `${pageHeader('จัดการคลังข้อสอบ',cloudEnabled?'คลังข้อสอบออนไลน์พร้อมแท็กหลายระดับ': 'เพิ่มข้อสอบทีละข้อ พร้อมเฉลย Key Point และ Topic Tag',canManage?`<button class="btn btn-primary" data-action="add-question">＋ เพิ่มข้อสอบ</button>`:'')}<section class="panel"><div class="panel-title"><div><h3>โครงสร้างแท็กหลายระดับ</h3><p>ประเภทการสอบ → ภาค → หมวดวิชา → เรื่องย่อย (Topic) — แต่ละข้อจะบันทึก Topic ไว้สำหรับ Analytics</p></div><span class="tag green">${visibleQuestions().length} ข้อ</span></div>${toolbar}</section><div class="section-title">รายการข้อสอบ <span>${isPro()?'รวมข้อสอบทุกหมวด':'ข้อสอบพื้นฐาน'} · 4 ตัวเลือก</span></div><div class="question-list">${qs.length?qs.map(q=>`<article class="question-card"><div class="question-card-top"><div><h3>${esc(q.text)}</h3><p>${cloudEnabled?'เฉลยจะแสดงหลังส่งคำตอบ':isPro()?`เฉลย: ${esc(q.choices?.[q.answer]||'')} · ${esc(q.keypoint||'ยังไม่มี Key Point')}`:'เฉลยละเอียดและ Key Point สำหรับสมาชิก Pro Max'}</p></div>${canManage?`<button class="btn btn-small btn-danger" data-delete-question="${esc(q     function render(){if(cloudEnabled&&!cloudSession?.access_token){app.innerHTML=authScreen();bindCloudAuth();return}if(cloudEnabled&&!cloudReady){app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;color:#52708e">กำลังเชื่อมต่อบัญชีและโหลดข้อมูล…</div>';return}if(cloudEnabled&&deviceBlocked){app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="panel" style="max-width:500px;text-align:center"><div class="hero-art">📱</div><h2>บัญชีนี้กำลังใช้งานบนอุปกรณ์อื่น</h2><p class="muted">ระบบอนุญาตหนึ่งอุปกรณ์ต่อบัญชีในเวลาเดียวกัน ปิดหน้าแอปบนอุปกรณ์เดิมแล้วลองอีกครั้ง หรือเข้าสู่ระบบใหม่ภายหลัง</p><button class="btn btn-outline" data-cloud-retry>ลองอีกครั้ง</button><button class="btn btn-primary" data-cloud-signout>ออกจากระบบ</button></section></div>`;app.querySelector('[data-cloud-retry]').onclick=()=>initializeCloud();app.querySelector('[data-cloud-signout]').onclick=()=>signOutCloud();return}app.innerHTML=shell();const content=document.getElementById('content');if(!content)return;content.innerHTML=page==='overview'?overview():page==='exams'?examCatalog():page==='analytics'?analytics():page==='bank'?bank():page==='session'?(session?renderSession():renderResult()):overview();bindEvents()}
    function bindCloudAuth(){app.querySelectorAll('[data-auth-mode]').forEach(b=>b.onclick=()=>{cloudAuthMode=b.dataset.authMode;cloudAuthMessage='';render()});const form=document.getElementById('cloud-auth-form');if(!form)return;form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),email=String(f.get('email')).trim(),password=String(f.get('password'));const button=form.querySelector('[type="submit"]');button.disabled=true;cloudAuthMessage='กำลังเชื่อมต่อ…';render();try{let result;if(cloudAuthMode==='signup'){result=await cloudAuthRequest('signup',{email,password});const next=result.session||result;if(next.access_token){next.expires_at=Date.now()+Number(next.expires_in||3600)*1000;saveCloudSession(next);cloudAuthMessage=''}else{cloudAuthMessage='สมัครสำเร็จแล้ว กรุณาตรวจอีเมลและกดยืนยันก่อนเข้าสู่ระบบ';render();return}}else{result=await cloudAuthRequest('token?grant_type=password',{email,password});result.expires_at=Date.now()+Number(result.expires_in||3600)*1000;saveCloudSession(result)}await initializeCloud()}catch(error){cloudAuthMessage='ดำเนินการไม่สำเร็จ: '+error.message;render()}}}

    function openSetup(mode,repairTopics=[]){const subset=visibleQuestions().filter(q=>(!repairTopics.length||repairTopics.includes(q.topic))&&(!questionFilter.type||q.type===questionFilter.type)&&(!questionFilter.part||q.part===questionFilter.part)&&(!questionFilter.subject||q.subject===questionFilter.subject)&&(!questionFilter.topic||q.topic===questionFilter.topic));if(!subset.length){showToast('ไม่มีข้อสอบที่ตรงกับตัวกรองนี้');return}const limit=Math.min(cloudEnabled?100:subset.length,isPro()?subset.length:Math.min(subset.length,remaining()));if(limit<1){modal(`<div class="modal-head"><div><h2>ใช้โควตาวันนี้ครบแล้ว</h2><p>สมาชิกฟรีทำได้สูงสุด 10 ข้อต่อวัน</p></div><button class="modal-close" data-modal-close>×</button></div><p class="muted">อัปเกรดเป็น Pro Max เพื่อเข้าถึงคลังข้อสอบและฝึกได้ไม่จำกัด</p><div class="modal-actions"><button class="btn btn-outline" data-modal-close>ปิด</button>${cloudEnabled?'<span class="tag amber">ติดต่อผู้ดูแลเพื่อเปิด Pro Max</span>':'<button class="btn btn-primary" data-upgrade>ทดลอง Pro Max</button>'}</div>`);const upgradeButton=document.querySelector('[data-upgrade]');if(upgradeButton)upgradeButton.onclick=()=>{document.querySelector('.modal-backdrop')?.remove();openAccount();loginPlan='pro'};return}
      const defaultN=Math.min(mode==='mock'?Math.min(10,limit):Math.min(5,limit),limit);modal(`<div class="modal-head"><div><h2>${mode==='mock'?'ตั้งค่าจำลองสนามจริง':'ตั้งค่าฝึกทำข้อสอบ'}</h2><p>${repairTopics.length?'ซ่อมเฉพาะ: '+repairTopics.join(', '):'ข้อสอบที่ตรงตามเงื่อนไข '+subset.length+' ข้อ'}</p></div><button class="modal-close" data-modal-close>×</button></div><form id="setup-form"><div class="field"><label>จำนวนข้อที่ต้องการทำ</label><input name="count" type="number" min="1" max="${limit}" value="${defaultN}" required></div><div class="field" style="margin-top:10px"><label>วิธีสุ่ม</label><div class="notice">${mode==='mock'?'ระบบจะสุ่มลำดับข้อและสลับตัวเลือก พร้อมจับเวลา 1 นาทีต่อข้อ':'ทำไปตรวจไป เห็นคำตอบและ Key Point หลังตอบแต่ละข้อ'}</div></div>${!isPro()?`<div class="notice" style="margin-top:10px">โควตาสมาชิกฟรีเหลือ ${remaining()} ข้อวันนี้</div>`:''}<div class="modal-actions"><button type="button" class="btn btn-outline" data-modal-close>ยกเลิก</button><button type="submit" class="btn btn-primary">เริ่ม${mode==='mock'?'จำลองสอบ':'ฝึกทำ'} →</button></div></form>`);document.getElementById('setup-form').onsubmit=e=>{e.preventDefault();const n=Math.min(Number(new FormData(e.currentTarget).get('count')),limit);document.querySelector('.modal-backdrop')?.remove();startSession(mode,subset,n,repairTopics.length>0)}}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function startSession(mode,pool,count,isRepair=false){let qs=shuffle([...pool]).slice(0,count).map(q=>({...q,choices:[...q.choices]})),choiceMaps=[];if(mode==='mock')qs=qs.map(q=>{const order=shuffle([0,1,2,3]);choiceMaps.push(order);return {...q,choices:order.map(i=>q.choices[i]),answer:cloudEnabled?-1:order.findIndex(i=>i===q.answer)}});session={mode,qs,index:0,selected:Array(count).fill(null),checked:false,isRepair,startedAt:new Date().toISOString(),seconds:count*60,choiceMaps,attemptId:null};sessionResult=null;page='session';render();if(mode==='mock')startTimer()}

    function openQuestionForm(){if(cloudEnabled&&db.user?.role!=='content_admin'){showToast('เฉพาะผู้ดูแลคลังข้อสอบเท่านั้น');return}const options=(name,opts,selected)=>`<select name="${name}" required>${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===selected?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;modal(`<div class="modal-head"><div><h2>เพิ่มข้อสอบใหม่</h2><p>ทุกข้อมี 4 ตัวเลือก และต้องกำหนด Topic เพื่อใช้วิเคราะห์ผล</p></div><button class="modal-close" data-modal-close>×</button></div><form id="question-form"><div class="modal-grid"><div class="field">ประเภทการสอบ${options('type',[{value:'general',label:'รอบทั่วไป'},{value:'special',label:'รอบกรณีพิเศษ'}],'general')}</div><div class="field">ภาค${options('part',PARTS.map(x=>({value:x,label:x})),'ภาค ก')}</div><div class="field">หมวดวิชา${options('subject',SUBJECTS.map(x=>({value:x,label:x})),SUBJECTS[0])}</div><div class="field">สิทธิ์เข้าถึง${options('access',[{value:'basic',label:'พื้นฐาน · สมาชิกฟรี'},{value:'pro',label:'Pro Max'}],isPro()?'pro':'basic')}</div><div class="field wide"><label>เรื่องย่อย · Topic Tag</label><input name="topic" placeholder="เช่น พ.ร.บ. การอาชีวศึกษา" required></div><div class="field wide"><label>คำถาม</label><textarea name="text" placeholder="พิมพ์คำถามที่นี่" required></textarea></div>${[0,1,2,3].map(i=>`<div class="field"><label>ตัวเลือก ${['ก','ข','ค','ง'][i]}</label><input name="choice${i}" required></div>`).join('')}<div class="field"><label>ข้อที่ถูกต้อง</label><select name="answer"><option value="0">ตัวเลือก ก</option><option value="1">ตัวเลือก ข</option><option value="2">ตัวเลือก ค</option><option value="3">ตัวเลือก ง</option></select></div><div class="field wide"><label>เฉลยอธิบาย</label><textarea name="explanation" placeholder="อธิบายเหตุผลของคำตอบ"></textarea></div><div class="field wide"><label>Key Point / คีย์เวิร์ด</label><input name="keypoint" placeholder="สรุปประเด็นสำคัญที่ต้องจำ"></div></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-modal-close>ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึกข้อสอบ</button></div></form>`);document.getElementById('question-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),q={type:String(f.get('type')),part:String(f.get('part')),subject:String(f.get('subject')),topic:String(f.get('topic')).trim(),access:String(f.get('access')),text:String(f.get('text')).trim(),choices:[0,1,2,3].map(i=>String(f.get('choice'+i)).trim()),answer:Number(f.get('answer')),explanation:String(f.get('explanation')||'').trim(),keypoint:String(f.get('keypoint')||'').trim()};try{if(cloudEnabled){await cloudRequest('/rest/v1/questions',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({exam_type:q.type,exam_part:q.part,subject:q.subject,topic:q.topic,access_tier:q.access,prompt:q.text,choices:q.choices,answer_index:q.answer,explanation:q.explanation,key_point:q.keypoint,is_published:true})});await loadCloudState()}else{q.id='q-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);db.questions.unshift(q);persist()}document.querySelector('.modal-backdrop')?.remove();page='bank';render();showToast('บันทึกข้อสอบและ Topic Tag แล้ว')}catch(error){showToast('บันทึกข้อสอบไม่สำเร็จ: '+error.message)}}}

    async function deleteQuestion(id){if(cloudEnabled&&db.user?.role!=='content_admin'){showToast('เฉพาะผู้ดูแลคลังข้อสอบเท่านั้น');return}if(!confirm(cloudEnabled?'ลบข้อสอบนี้ออกจากคลังออนไลน์หรือไม่? ประวัติการตอบเดิมยังอยู่':'ลบข้อสอบนี้ออกจากคลังในอุปกรณ์นี้? ประวัติการตอบเดิมจะยังอยู่'))return;try{if(cloudEnabled){await cloudRequest('/rest/v1/questions?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadCloudState()}else{db.questions=db.questions.filter(q=>q.id!==id);persist()}render();showToast('ลบข้อสอบแล้ว')}catch(error){showToast('ลบข้อสอบไม่สำเร็จ: '+error.message)}}

    function exportQuestions(){const blob=new Blob([JSON.stringify(db.questions,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='athiwat-question-bank.json';a.click();URL.revokeObjectURL(a.href);showToast('ส่งออกคลังข้อสอบแล้ว')}
    document.getElementById('import-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const arr=JSON.parse(await file.text());if(!Array.isArray(arr))throw new Error('รูปแบบไฟล์ต้องเป็น JSON array');const normalized=arr.map((q,i)=>{if(!q.text||!Array.isArray(q.choices)||q.choices.length!==4||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3||!q.topic)throw new Error('ข้อ '+(i+1)+' ต้องมีโจทย์ ตัวเลือก 4 ข้อ คำตอบ และ Topic');return {...q,id:String(q.id||'import-'+Date.now()+'-'+i),type:q.type==='special'?'special':'general',part:PARTS.includes(q.part)?q.part:'ภาค ก',subject:String(q.subject||'วิชาการศึกษา'),topic:String(q.topic),access:q.access==='pro'?'pro':'basic',text:String(q.text),choices:q.choices.map(String),answer:Number(q.answer),explanation:String(q.explanation||''),keypoint:String(q.keypoint||'')}});const ids=new Set(db.questions.map(q=>q.id));const unique=normalized.map(q=>ids.has(q.id)?{...q,id:q.id+'-'+Math.random().toString(36).slice(2,5)}:q);db.questions.push(...unique);persist();render();showToast('นำเข้า '+unique.length+' ข้อแล้ว')}catch(err){showToast('นำเข้าไม่สำเร็จ: '+err.message)}e.target.value=''};
    function renderSession(){if(!session)return sessionResult?renderResult():overview();const s=session,q=s.qs[s.index],selected=s.selected[s.index],practice=s.mode==='practice';return `${pageHeader(practice?'ฝึกทำข้อสอบ':'จำลองสนามจริง',practice?'ตรวจคำตอบทันที พร้อม Key Point':'เลือกคำตอบให้ครบก่อนหมดเวลา แล้วกดส่งข้อสอบ',`<button class="btn btn-outline btn-small" data-session-exit>ออกจากชุด</button>`)}<div class="exam-layout"><section class="panel exam-question"><div class="exam-q-top"><span>ข้อ ${s.index+1} / ${s.qs.length}</span><div class="meta"><span class="tag gray">${esc(TYPE_LABEL[q.type])}</span><span class="tag gray">${esc(q.part)}</span><span class="tag">${esc(q.topic)}</span></div></div><div class="progress-wrap" style="margin-top:12px"><div class="progress-bar" style="width:${(s.index+1)/s.qs.length*100}%"></div></div><h2 class="exam-q-text">${esc(q.text)}</h2><div class="choices">${q.choices.map((c,i)=>{const isChecked=practice&&s.checked,gotRight=q.cloudCorrect??(selected===q.answer),correct=isChecked&&q.answer>=0&&i===q.answer,wrong=isChecked&&i===selected&&!gotRight;return `<button class="choice ${selected===i?'selected':''} ${correct?'correct':''} ${wrong?'incorrect':''}" ${practice?`data-choice="${i}"`:`data-mock-choice="${i}"`} ${isChecked?'disabled':''}><span class="choice-letter">${['ก','ข','ค','ง'][i]}</span><span>${esc(c)}</span>${correct?'<span style="margin-left:auto;color:#1a966b">✓</span>':wrong?'<span style="margin-left:auto;color:#d64f5b">×</span>':''}</button>`}).join('')}</div>${practice&&s.checked?`<div class="feedback ${(q.cloudCorrect??(selected===q.answer))?'correct':'incorrect'}"><strong>${(q.cloudCorrect??(selected===q.answer))?'✓ ตอบถูกต้อง':'✕ ยังไม่ถูกต้อง'}${!isPro()?' · '+((q.cloudCorrect??(selected===q.answer))?'เก่งมาก!':'ลองทบทวนเรื่องนี้อีกครั้ง'):''}</strong>${isPro()?`<div class="keypoint">${esc(q.explanation||'')}<br><strong>Key Point:</strong> ${esc(q.keypoint||'—')}</div>`:''}</div>`:''}<div class="exam-controls"><span class="muted" style="font-size:10px">${esc(q.subject)} · ${esc(q.topic)}</span>${practice?(s.checked?`<button class="btn btn-primary" data-practice-next>${s.index===s.qs.length-1?'ดูผลสรุป':'ข้อต่อไป →'}</button>`:`<button class="btn btn-primary" data-practice-next ${selected==null?'disabled':''}>${s.index===s.qs.length-1?'ตรวจคำตอบ':'ตรวจคำตอบ →'}</button>`):`<button class="btn btn-primary" data-mock-submit>ส่งข้อสอบ</button>`}</div></section><aside class="exam-side">${practice?`<div class="mini-panel"><h4>ความคืบหน้า</h4><div class="timer" style="font-size:21px">${s.index+1} / ${s.qs.length}</div><div class="muted" style="font-size:10px;margin-top:4px">ตอบถูกสะสม ${s.correctCount||0} ข้อ</div></div>`:`<div class="mini-panel"><h4>เวลาคงเหลือ</h4><div class="timer" id="timer">${formatTime(s.seconds)}</div><div class="muted" style="font-size:10px;margin-top:4px">ประมาณ 1 นาทีต่อข้อ</div></div><div class="mini-panel"><h4>แผนผังข้อสอบ</h4><div class="number-grid">${s.qs.map((_,i)=>`<button class="number-cell ${s.selected[i]!=null?'answered':''} ${s.index===i?'current':''}" data-mock-index="${i}">${i+1}</button>`).join('')}</div><div class="muted" style="font-size:10px;margin-top:8px">ตอบแล้ว ${s.selected.filter(x=>x!=null).length} / ${s.qs.length} ข้อ</div></div>`}<div class="warning-box">${practice?'เฉลยและ Key Point แบบละเอียดจะแสดงสำหรับสมาชิก Pro Max':'ยังไม่แสดงเฉลยจนกว่าจะส่งข้อสอบ'}</div></aside></div>`}
    function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
    function startTimer(){stopTimer();timerId=setInterval(()=>{if(!session)return stopTimer();session.seconds--;const node=document.getElementById('timer');if(node)node.textContent=formatTime(Math.max(0,session.seconds));if(session.seconds<=0)submitMock(true)},1000)}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
    function chooseAnswer(n){if(!session||session.mode!=='practice'||session.checked)return;session.selected[session.index]=n;render()}
    function saveOne(q,answer,mode){const correct=answer===q.answer;db.answers.push({questionId:q.id,topic:q.topic,subject:q.subject,part:q.part,type:q.type,correct,mode,at:new Date().toISOString()});if(!isPro())db.freeUsage.count++;return correct}
    async function nextPractice(){if(!session)return;const s=session,q=s.qs[s.index];if(!s.checked){if(s.selected[s.index]==null)return;let right;if(cloudEnabled){try{const response=await cloudRpc('check_practice_answer',{p_question_id:q.id,p_selected_index:s.selected[s.index]});const detail=Array.isArray(response)?response[0]:response;right=Boolean(detail?.is_correct);q.cloudCorrect=right;if(detail?.correct_index!=null)q.answer=Number(detail.correct_index);q.explanation=detail?.explanation||'';q.keypoint=detail?.key_point||''}catch(e){showToast('ตรวจคำตอบไม่สำเร็จ: '+e.message);return}}else right=saveOne(q,s.selected[s.index],'practice');s.checked=true;s.correctCount=(s.correctCount||0)+(right?1:0);if(!cloudEnabled)persist();render();return}if(s.index<s.qs.length-1){s.index++;s.checked=false;render();return}await finishSession()}

    async function submitMock(auto){if(!session||session.mode!=='mock'||session.submitting)return;if(!auto&&!confirm('ส่งข้อสอบและดูผลคะแนนหรือไม่?'))return;const s=session;s.submitting=true;stopTimer();try{let score=0,correct=[];if(cloudEnabled){const selected=s.selected.map((n,i)=>n==null?null:s.choiceMaps[i][n]);const result=await cloudRpc('submit_exam',{p_mode:'mock',p_question_ids:s.qs.map(q=>q.id),p_selected_indices:selected});const details=result.details||[];const byId=new Map(details.map(d=>[String(d.question_id),d]));s.qs.forEach((q,i)=>{const d=byId.get(String(q.id));q.cloudCorrect=Boolean(d?.is_correct);correct[i]=q.cloudCorrect;if(d?.correct_index!=null)q.answer=s.choiceMaps[i].indexOf(Number(d.correct_index))});score=Number(result.score||0);if(isPro()){await Promise.all(s.qs.map(async q=>{const response=await cloudRpc('check_practice_answer',{p_question_id:q.id,p_selected_index:0}),d=Array.isArray(response)?response[0]:response;q.explanation=d?.explanation||'';q.keypoint=d?.key_point||''}))}await loadCloudState()}else{s.qs.forEach((q,i)=>{if(saveOne(q,s.selected[i],'mock'))score++;correct[i]=s.selected[i]===q.answer});db.attempts.push({mode:'mock',score,total:s.qs.length,at:new Date().toISOString(),secondsUsed:s.qs.length*60-s.seconds});persist()}sessionResult={mode:'mock',score,total:s.qs.length,qs:s.qs,selected:s.selected,correct,auto};session=null;page='session';render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){s.submitting=false;showToast('ส่งข้อสอบไม่สำเร็จ: '+e.message);if(s.seconds<=0)s.seconds=1;startTimer()}}

    async function finishSession(){const s=session;if(!s)return;try{let score=s.correctCount||0,correct=s.qs.map(q=>Boolean(q.cloudCorrect));if(cloudEnabled){const result=await cloudRpc('submit_exam',{p_mode:'practice',p_question_ids:s.qs.map(q=>q.id),p_selected_indices:s.selected});score=Number(result.score||0);const details=result.details||[];const byId=new Map(details.map(d=>[String(d.question_id),d]));s.qs.forEach((q,i)=>{const d=byId.get(String(q.id));q.cloudCorrect=Boolean(d?.is_correct);correct[i]=q.cloudCorrect;if(d?.correct_index!=null)q.answer=Number(d.correct_index)});await loadCloudState()}else{db.attempts.push({mode:'practice',score,total:s.qs.length,at:new Date().toISOString()});persist()}sessionResult={mode:'practice',score,total:s.qs.length,qs:s.qs,selected:s.selected,correct,isRepair:s.isRepair};session=null;page='session';render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){showToast('บันทึกผลฝึกไม่สำเร็จ: '+e.message)}}

    function renderResult(){const r=sessionResult;if(!r)return overview();const pct=Math.round(100*r.score/Math.max(r.total,1));const rows=r.qs.map((q,i)=>{const right=r.correct?.[i]??q.cloudCorrect??(q.answer>=0&&r.selected[i]===q.answer);const answerText=q.answer>=0&&isPro()?` · คำตอบ: ${esc(q.choices[q.answer])}`:'';return `<article class="question-card"><div class="question-card-top"><div><h3>${i+1}. ${esc(q.text)}</h3><p>${right?'<span style="color:#16805d;font-weight:800">ตอบถูก</span>':'<span style="color:#bc424c;font-weight:800">ตอบผิด/ไม่ได้ตอบ</span>'}${answerText}</p></div><span class="tag ${right?'green':'red'}">${right?'ถูก':'ผิด'}</span></div>${isPro()?`<div class="divider"></div><p>${esc(q.explanation||'')}<br><strong>Key Point:</strong> ${esc(q.keypoint||'—')}</p>`:`<div class="muted" style="font-size:10px;margin-top:8px">เฉลยละเอียดและ Key Point สำหรับสมาชิก Pro Max</div>`}<div class="meta"><span class="tag">${esc(q.topic)}</span><span class="tag gray">${esc(q.subject)}</span></div></article>`}).join('');const weak=getTopicStats().filter(x=>x.count&&x.percent<60);return `${pageHeader('สรุปผลการสอบ',r.mode==='mock'?'ส่งข้อสอบเรียบร้อยแล้ว':'ทำครบชุดแล้ว')}<section class="hero" style="min-height:130px"><div class="hero-copy"><div class="hero-kicker">คะแนนของคุณ</div><h2>${r.score} / ${r.total} ข้อ <span style="font-size:19px">· ${pct}%</span></h2><p>${pct>=80?'ยอดเยี่ยม รักษาจังหวะการฝึกต่อไป':pct>=60?'ทำได้ดี ทบทวนหัวข้อที่พลาดเพิ่มอีกนิด':'ใช้ปุ่มซ่อมจุดอ่อนเพื่อฝึกเฉพาะเรื่องที่ควรทบทวน'}</p></div><div class="hero-art">${pct>=80?'🏆':'📈'}</div></section><div class="page-actions" style="justify-content:flex-start;margin:15px 0"><button class="btn btn-primary" data-action="repair" ${weak.length?'':'disabled'}>🎯 ซ่อมจุดอ่อน${weak.length?' ('+weak.length+' เรื่อง)':''}</button><button class="btn btn-ghost" data-nav="analytics">ดูวิเคราะห์ทั้งหมด</button><button class="btn btn-outline" data-retry>ทำชุดใหม่</button><button class="btn btn-outline" data-nav="overview">กลับหน้าหลัก</button></div><div class="section-title">เฉลยรายข้อ <span>${isPro()?'พร้อม Key Point':'สมาชิกฟรีเห็นผลถูก/ผิด'}</span></div><div class="question-list">${rows}</div>`}

    function startRepair(){const weak=getTopicStats().filter(x=>x.count&&x.percent<60).map(x=>x.topic);if(!weak.length){showToast('ยังไม่มีเรื่องที่คะแนนต่ำกว่า 60%');return}const pool=visibleQuestions().filter(q=>weak.includes(q.topic));if(!pool.length){showToast('ไม่มีข้อสอบใน Topic จุดอ่อน กรุณาเพิ่มข้อสอบ');return}questionFilter={type:'',part:'',subject:'',topic:''};openSetup('practice',weak)}
    function exitSession(){if(!session)return;if(!confirm('ออกจากข้อสอบหรือไม่? ความคืบหน้าชุดนี้จะไม่ถูกสรุป'))return;stopTimer();session=null;page='overview';render()}
    render();
    if(cloudEnabled)initializeCloud();
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
  </script>
